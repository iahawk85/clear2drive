map $uri $asset_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $asset_cache_control;
  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
  location / { try_files $uri $uri/ /index.html; }
}
